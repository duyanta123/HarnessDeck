# Generated by packaging/generate.mjs — edit that script, not this file.
app-id: io.github.duyanta123.harnessdeck
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: harnessdeck
separate-locales: false

# Ubuntu 22.04 ships flatpak-builder 1.2, whose automatic composer is
# unavailable inside a GNOME 49 build sandbox. AppStream is validated as a
# separate workflow gate; Flathub's current builder composes it on submission.
appstream-compose: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The harness is fetched from the npm registry and talks to DeepSeek.
  - --share=network
  # The tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
  # The app's reason for existing is working in the user's own project
  # directories. Narrower than this and it cannot do the one thing it is for.
  - --filesystem=home

modules:
  - name: harnessdeck
    buildsystem: simple
    build-commands:
      # A .deb is an ar archive holding a tarball; flatpak-builder unpacks
      # neither, so the module does it by hand. The payload of this one is
      # usr/bin/harnessdeck, three hicolor icon sizes, and a desktop entry named
      # after the product rather than the binary — "HarnessDeck.desktop".
      - ar x harnessdeck.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/harnessdeck /app/bin/harnessdeck
      - 'install -Dm644 "usr/share/applications/HarnessDeck.desktop" /app/share/applications/io.github.duyanta123.harnessdeck.desktop'
      # Flatpak resolves an icon by app-id, so both the file names and the Icon
      # key have to be the reverse-DNS name and not "harnessdeck".
      - desktop-file-edit --set-icon=io.github.duyanta123.harnessdeck /app/share/applications/io.github.duyanta123.harnessdeck.desktop
      - |
        for size in 32x32 128x128 256x256@2; do
          install -Dm644 "usr/share/icons/hicolor/$size/apps/harnessdeck.png"             "/app/share/icons/hicolor/$size/apps/io.github.duyanta123.harnessdeck.png"
        done
      - install -Dm644 io.github.duyanta123.harnessdeck.metainfo.xml /app/share/metainfo/io.github.duyanta123.harnessdeck.metainfo.xml
    sources:
      - type: file
        url: https://github.com/duyanta123/HarnessDeck/releases/download/v0.1.0/HarnessDeck_0.1.0_amd64.deb
        sha256: 300a8c096df30e0795f15f64cb138b261c826ac790d1f3724a83738f89c60365
        dest-filename: harnessdeck.deb
      - type: file
        path: io.github.duyanta123.harnessdeck.metainfo.xml
