name: Package channels

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: package-channels-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    name: Regenerate manifests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: node packaging/generate.mjs "${{ github.event.release.tag_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-channel-manifests
          include-hidden-files: true
          path: |
            bucket/harnessdeck.json
            packaging/winget
            packaging/homebrew
            packaging/aur
            packaging/flathub
            website/latest.json

  winget:
    name: Validate WinGet
    needs: generate
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-channel-manifests
      - run: winget validate --manifest packaging\winget

  homebrew:
    name: Validate Homebrew Cask
    needs: generate
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-channel-manifests
      - run: brew style packaging/homebrew/harnessdeck.rb
      - name: Audit Cask from a temporary tap
        run: |
          brew tap-new --no-git duyanta123/harnessdeck
          tap_root="$(brew --repository duyanta123/harnessdeck)"
          mkdir -p "$tap_root/Casks"
          cp packaging/homebrew/harnessdeck.rb "$tap_root/Casks/harnessdeck.rb"
          # This is an independent tap, not a submission to homebrew-cask, so
          # core's popularity threshold is not part of its validity. Platform
          # signing is optional until this repository has signing credentials,
          # so validation must not turn Gatekeeper into a release prerequisite.
          brew audit --cask --strict duyanta123/harnessdeck/harnessdeck

  aur:
    name: Validate AUR package
    needs: generate
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git namcap
      - uses: actions/download-artifact@v4
        with:
          name: package-channel-manifests
      - run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- sh -c 'cd packaging/aur && makepkg --printsrcinfo > generated.SRCINFO'
          diff -u packaging/aur/.SRCINFO packaging/aur/generated.SRCINFO
          namcap packaging/aur/PKGBUILD

  flatpak:
    name: Build Flatpak manifest
    needs: generate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-channel-manifests
      - run: |
          sudo apt-get update
          sudo apt-get install -y appstream-compose flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder org.gnome.Platform//49 org.gnome.Sdk//49
          flatpak-builder --user --force-clean --disable-rofiles-fuse build-dir packaging/flathub/app.harnessdeck.yml
      - name: Validate AppStream with Flathub's linter
        run: |
          flatpak run --user --filesystem="$GITHUB_WORKSPACE" \
            --command=flatpak-builder-lint org.flatpak.Builder \
            appstream "$GITHUB_WORKSPACE/packaging/flathub/app.harnessdeck.metainfo.xml"

  commit:
    name: Publish generated manifests to main
    if: github.repository == 'duyanta123/HarnessDeck'
    needs: [winget, homebrew, aur, flatpak]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: package-channel-manifests
      - name: Commit only validated channel manifests
        run: |
          git add -- \
            bucket/harnessdeck.json \
            packaging/winget \
            packaging/homebrew \
            packaging/aur \
            packaging/flathub \
            website/latest.json
          if git diff --cached --quiet; then
            echo "Channel manifests already match the published release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="${{ github.event.release.tag_name }}"
          if [ -z "$version" ]; then version="latest release"; fi
          git commit -m "chore: update package channels for $version"
          git push origin HEAD:main
